<!--meta
out: contact/index.html
title: Contact | Current Collective
description: Get in touch with Connor at Current Collective. Book a 15 minute call, email, or send a message.
css: pages.css contact.css
body: theme-post
js: contact.js
nav: contact
cta: no
mbar: no
-->
<section class="post-scene">
  <div class="sky" role="img" aria-label="Sunset over the water"></div>
  <div class="wrap post-wrap">
    <div class="post-head">
      <span class="label light rv">[ Contact ]</span>
      <h1 class="rv" style="--i:1">Send me a <em>postcard.</em></h1>
      <p class="clock rv" style="--i:2"><span class="dot"></span>It's <b data-clock>9:00am</b> in Moreton Bay. I usually reply within a day.</p>
    </div>

    <form class="postcard rv" style="--i:2" name="contact" method="POST" data-netlify="true" netlify-honeypot="company_website" action="{R}thanks/" novalidate>
      <input type="hidden" name="form-name" value="contact">
      <p class="hp"><label>Leave this empty <input name="company_website" tabindex="-1" autocomplete="off"></label></p>
      <input type="hidden" name="utm_source"><input type="hidden" name="utm_medium"><input type="hidden" name="utm_campaign"><input type="hidden" name="gclid"><input type="hidden" name="fbclid"><input type="hidden" name="first_referrer"><input type="hidden" name="landing_page">
      <input type="hidden" name="need" value="Contact form">
      <div class="pc-left">
        <label class="pc-label" for="c-msg">Dear Connor,</label>
        <textarea id="c-msg" name="message" rows="7" required placeholder="What's on your mind? A website, an audit, a quick question..."></textarea>
        <span class="pc-from">Greetings from <em>your business</em></span>
      </div>
      <div class="pc-right">
        <div class="stamp-row" aria-hidden="true">
          <div class="postmark"><svg viewBox="0 0 120 120"><defs><path id="pm" d="M60 14a46 46 0 1 1 0 92a46 46 0 1 1 0-92"/></defs><circle cx="60" cy="60" r="54"/><circle cx="60" cy="60" r="38"/><text><textPath href="#pm">MORETON BAY QLD · 4505 · MORETON BAY QLD ·</textPath></text><text x="60" y="56" text-anchor="middle" class="pm-d" data-pmday>19 OCT</text><text x="60" y="72" text-anchor="middle" class="pm-y">2026</text></svg><i class="wave"></i></div>
          <div class="stamp"><div class="st-art"><i class="sun"></i><i class="sea"></i></div><span>Current Collective</span><b>$0</b></div>
        </div>
        <div class="pc-field"><label for="c-name">Name</label><input id="c-name" name="name" autocomplete="name" required></div>
        <div class="pc-field"><label for="c-biz">Business <small>(optional)</small></label><input id="c-biz" name="business" autocomplete="organization"></div>
        <div class="pc-field"><label for="c-phone">Mobile</label><input id="c-phone" name="phone" type="tel" autocomplete="tel"></div>
        <div class="pc-field"><label for="c-email">Email</label><input id="c-email" name="email" type="email" autocomplete="email" required></div>
      </div>
      <div class="pc-send"><button class="btn btn-orange" type="submit">Post it <span class="arr">→</span></button></div>
      <div class="ok" role="status" aria-live="polite" tabindex="-1"><div class="tick">✓</div><h3>Posted. Thanks.</h3><p>I'll get back to you within a day or so.</p></div>
    </form>

    <div class="ways-row rv" style="--i:3">
      <span>Or:</span>
      <a href="https://calendly.com/con-aikens/30min" target="_blank" rel="noopener">Book a 15 min call →</a>
      <a href="{R}audit/">Free website audit →</a>
      <a href="mailto:con.aikens@gmail.com">con.aikens@gmail.com</a>
      <a href="https://instagram.com/currentcollectiveagency" target="_blank" rel="noopener">@currentcollectiveagency</a>
    </div>
  </div>
</section>
